<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چت بات GapGPT</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#6366f1',
                            600: '#4f46e5',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Vazirmatn Font -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.25s ease-out forwards; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 h-full flex flex-col justify-between overflow-hidden">

    <!-- Header & Settings Bar -->
    <header class="bg-gray-900 border-b border-gray-800 p-4 shrink-0 shadow-lg z-10">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row gap-4 items-start sm:items-center justify-between">
            <div class="flex items-center gap-2 shrink-0">
                <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
                <h1 class="font-bold text-lg text-gray-200">چت GapGPT</h1>
            </div>

            <!-- Settings Inputs (Stacked Vertically, LTR Direction) -->
            <div class="flex flex-col gap-2 w-full sm:w-auto items-stretch sm:items-end">
                <!-- API Key Input (Wider) -->
                <div class="w-full sm:w-80">
                    <input 
                        type="text" 
                        id="apiKeyInput" 
                        dir="ltr"
                        placeholder="API Key..." 
                        class="w-full bg-gray-800 border border-gray-700 text-gray-200 px-3 py-1.5 rounded-lg focus:outline-none focus:border-brand-500 transition-colors text-left text-xs sm:text-sm font-mono placeholder:text-right placeholder:font-sans"
                    >
                </div>
                <!-- Model Input (Slightly narrower) -->
                <div class="w-full sm:w-56">
                    <input 
                        type="text" 
                        id="modelInput" 
                        dir="ltr"
                        placeholder="Model..." 
                        class="w-full bg-gray-800 border border-gray-700 text-gray-200 px-3 py-1.5 rounded-lg focus:outline-none focus:border-brand-500 transition-colors text-left text-xs sm:text-sm font-mono placeholder:text-right placeholder:font-sans"
                    >
                </div>
            </div>
        </div>
    </header>

    <!-- Main Chat Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 pb-12 flex flex-col min-h-0">
        
        <!-- Messages Scrollable Area -->
        <div id="chatBox" class="flex-1 overflow-y-auto space-y-4 pr-1 pl-1 pb-4">
            <div class="text-center text-gray-500 text-sm my-8">
                گفتگو را شروع کنید. تنظیمات توکن و مدل در بالای صفحه قرار دارد.
            </div>
        </div>

        <!-- Input Area at Bottom -->
        <div class="shrink-0 pt-2">
            <form id="chatForm" class="flex gap-2 items-center">
                <textarea 
                    id="userInput" 
                    rows="1" 
                    placeholder="پیام خود را بنویسید..." 
                    class="flex-1 bg-gray-900 border border-gray-800 text-gray-100 rounded-xl px-4 py-3 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all resize-none max-h-32 shadow-inner"
                    onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); this.form.dispatchEvent(new Event('submit', {cancelable: true, bubbles: true})); }"
                ></textarea>
                <button 
                    type="submit" 
                    id="sendBtn" 
                    class="bg-brand-600 hover:bg-brand-500 text-white font-medium px-5 py-3 rounded-xl transition-all shadow-lg flex items-center gap-1 disabled:opacity-50 disabled:cursor-not-allowed shrink-0"
                >
                    <span>ارسال</span>
                    <svg class="w-4 h-4 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                    </svg>
                </button>
            </form>
        </div>
    </main>

    <script>
        // DOM Elements
        const apiKeyInput = document.getElementById('apiKeyInput');
        const modelInput = document.getElementById('modelInput');
        const chatBox = document.getElementById('chatBox');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // State Variables
        let lastResponseId = null;
        let loadingTimer = null;

        // Default values
        const DEFAULT_TOKEN = "YOUR-GAPGPT-TOKEN";
        const DEFAULT_MODEL = "deepseek-v4-flash";

        // Load and TRIM initial values from LocalStorage or defaults
        const savedToken = localStorage.getItem('gapgpt_api_key');
        const savedModel = localStorage.getItem('gapgpt_model');

        apiKeyInput.value = (savedToken !== null ? savedToken : DEFAULT_TOKEN).trim();
        modelInput.value = (savedModel !== null ? savedModel : DEFAULT_MODEL).trim();

        // Auto Save to LocalStorage with TRIM on input change
        apiKeyInput.addEventListener('input', (e) => {
            const cleanVal = e.target.value.trim();
            localStorage.setItem('gapgpt_api_key', cleanVal);
        });

        // تغییر مدل: ذخیره‌سازی در LocalStorage + ریست کردن ID پاسخ قبلی
        modelInput.addEventListener('input', (e) => {
            const cleanVal = e.target.value.trim();
            localStorage.setItem('gapgpt_model', cleanVal);
            lastResponseId = null;
        });

        // Function to smoothly scroll chat down
        function scrollToBottom() {
            chatBox.scrollTo({
                top: chatBox.scrollHeight,
                behavior: 'smooth'
            });
        }

        // Add message bubble to chat UI
        function appendMessage(role, text, modelName = null) {
            const isUser = role === 'user';
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex ${isUser ? 'justify-start' : 'justify-end'} animate-fade-in`;

            const bubble = document.createElement('div');
            bubble.className = `max-w-[85%] sm:max-w-[75%] rounded-2xl px-4 py-3 text-sm leading-relaxed ${
                isUser 
                    ? 'bg-brand-600 text-white rounded-tr-none shadow-md' 
                    : 'bg-gray-900 text-gray-200 border border-gray-800 rounded-tl-none shadow-sm'
            }`;

            // اعمال trim روی متن ورودی برای حذف خطوط خالی اضافی در ابتدا و انتها
            const cleanText = text ? text.trim() : '';

            if (!isUser && modelName) {
                const badge = document.createElement('div');
                badge.className = 'inline-block mb-1.5 px-2 py-0.5 text-[10px] font-mono text-gray-400 bg-gray-800/80 border border-gray-700/60 rounded-md dir-ltr text-left select-all';
                badge.dir = 'ltr';
                badge.innerText = modelName;

                const textDiv = document.createElement('div');
                textDiv.className = 'whitespace-pre-wrap w-full';
                textDiv.innerText = cleanText;

                bubble.appendChild(badge);
                bubble.appendChild(textDiv);
            } else {
                bubble.style.whiteSpace = 'pre-wrap';
                bubble.innerText = cleanText;
            }

            msgDiv.appendChild(bubble);
            chatBox.appendChild(msgDiv);
            scrollToBottom();
        }

        // Add Loading indicator with DELAY
        function scheduleLoading(delayMs = 600) {
            clearTimeout(loadingTimer);

            loadingTimer = setTimeout(() => {
                if (document.getElementById('loadingIndicator')) return;

                const loaderDiv = document.createElement('div');
                loaderDiv.id = 'loadingIndicator';
                loaderDiv.className = 'flex justify-end animate-fade-in';
                loaderDiv.innerHTML = `
                    <div class="bg-gray-900 border border-gray-800 rounded-2xl rounded-tl-none px-4 py-3 text-gray-400 text-sm flex items-center gap-2">
                        <div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce"></div>
                        <div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce [animation-delay:-0.15s]"></div>
                        <div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce [animation-delay:-0.3s]"></div>
                    </div>
                `;
                chatBox.appendChild(loaderDiv);
                scrollToBottom();
            }, delayMs);
        }

        function removeLoading() {
            clearTimeout(loadingTimer);
            const loader = document.getElementById('loadingIndicator');
            if (loader) loader.remove();
        }

        // Form Submit Handler
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            const apiKey = apiKeyInput.value.trim();
            const model = modelInput.value.trim();

            if (!text) return;
            if (!apiKey) {
                alert('لطفاً توکن API را وارد کنید.');
                return;
            }

            appendMessage('user', text);
            userInput.value = '';
            sendBtn.disabled = true;

            const inputModelName = model || DEFAULT_MODEL;

            const payload = {
                model: inputModelName,
                input: text
            };

            if (lastResponseId) {
                payload.previous_response_id = lastResponseId;
            }

            scheduleLoading(600);

            try {
                const response = await fetch('https://api.gapgpt.app/v1/responses', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                removeLoading();

                if (response.ok && data.id) {
                    lastResponseId = data.id;

                    let assistantText = "پاسخی دریافت نشد.";
                    if (data.output && data.output[0] && data.output[0].content && data.output[0].content[0]) {
                        assistantText = data.output[0].content[0].text;
                    }

                    appendMessage('assistant', assistantText, inputModelName);
                } else {
                    const errorMsg = data.error ? (data.error.message || JSON.stringify(data.error)) : 'خطا در برقراری ارتباط با سرور';
                    appendMessage('assistant', `❌ خطا: ${errorMsg}`, inputModelName);
                }
            } catch (err) {
                removeLoading();
                appendMessage('assistant', `❌ خطا در شبکه: ${err.message}`, inputModelName);
            } finally {
                sendBtn.disabled = false;
                scrollToBottom();
            }
        });
    </script>
</body>
</html>
